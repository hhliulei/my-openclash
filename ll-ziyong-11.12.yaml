# 我的 DNS配置
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  use-hosts: true           #是否回应配置中的 hosts，默认 true
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  default-nameserver: *direct-IPdoh
  proxy-server-nameserver: *direct-YMdoh
  direct-nameserver: *direct-YMdoh
  nameserver-policy:
    'rule-set:cn_domain,private_domain,fakeipfilter_cn,steamcn_domain,microsoftcn_domain,applecn_domain': *direct-po-YMdoh-po
    'rule-set:fakeipfilter_!cn': *proxy-po-IPdoh-po
  nameserver: *proxy-na-IPdoh-na
  fallback: *proxy-fb-IPdoh-fb
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-filter: ['rule-set:fakeipfilter_cn', 'rule-set:fakeipfilter_!cn', 'rule-set:private_domain', 'rule-set:cn_domain', 'rule-set:microsoftcn_domain', 'rule-set:applecn_domain', 'rule-set:steamcn_domain']

