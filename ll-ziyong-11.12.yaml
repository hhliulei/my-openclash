# ███████████████████████████ 核心配置 ███████████████████████████
# ══ 基础配置 ══
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894

ipv6: false
allow-lan: true
bind-address: '*'
log-level: info

# ══ TCP 连接 ══
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 15
keep-alive-idle: 600

# ══ 认证配置 ══
authentication: ['hh1992:hh19920111']
skip-auth-prefixes: ['127.0.0.0/8', '192.168.0.0/16', '::1/128']

# ══ 配置存储 ══
profile: {store-selected: true, store-fake-ip: true}

# ══ 管理面板配置 ══
external-controller: 0.0.0.0:9090
secret: 'hh19920111'
external-ui: ui
external-ui-name: zashboard
external-ui-url: 'https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip'

# ══ GEO 数据库配置 ══
# 各个数据库源地址
geox-url:
  mmdb: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb'

ntp:
  enable: true
  write-to-system: true

# ══ TUN配置 ══
tun:
  enable: true
  stack: mips       ## 协议栈：mixed (混合) / system / gvisor / mips ##如果内核版本大于v1.19.31，此处可以改为自研协议栈 mips ，理论上性能更好。
  dns-hijack: ['any:53', 'tcp://any:53']
  auto-route: true                                                                       # 仅linux生效
  auto-redirect: true
  auto-detect-interface: true
  route-exclude-address-set:               # 绕过大陆 匹配大陆IP-CIDR（流量不进入代理）  仅linux生效
    - cn_ip                                # 绕过CN IP

# ══ 嗅探功能 ══
sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: false
  override-destination: false
  sniff: {HTTP: {ports: [80, 8080-8880]}, TLS: {ports: [443, 8443]}, QUIC: {ports: [443, 8443]}}
  skip-domain: ['Mijia Cloud', '+.push.apple.com']

