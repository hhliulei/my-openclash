DE: &DE {filter: '(?i)(🇩🇪|德国|德意志|法兰克福|柏林|慕尼黑|杜塞尔多夫|frankfurt|berlin|munich|germany|(?<![a-zA-Z])(de|deu|fra|muc|dus)(?![a-zA-Z]))'}
