# 描述: 基于Mihomo的智能代理配置 集成Smart算法自动选择最优节点，支持故障转移和负载均衡  覆盖AI、流媒体、电报等应用场景

# ███████████████████████████ 锚点区域 ███████████████████████████
# --- 锚点定义 (通用属性) ---
# ══ 订阅锚点 ══        # 只看见此节点请更新客户端|测试|试用|使用
DY: &DY {type: http, interval: 0, proxy: 直接连接, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300},
 exclude-filter: '(?i)(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|提示|特别|访问|支持|教程|关注|作者|加入|剩余|重置|到期|导航|有效期|建议|更新|显示|客户端|时间|维护|浙地珠宝|异常|失联|失败|套餐|域名|问题|自动|单数|双数|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|距离|超时|收藏|福利|好友|选择|公益|发布|DIZTNA|通路|登录|禁止|定时|渠道|牢记|永久|余额|阁下|本站|刷新|⚠️|@|http|com)'}
# 节点筛选正则表达式 - 基于地理位置和关键词过滤
# ══ 出站锚点 ══
# 策略组代理列表模板 - 预定义的代理节点优先级排序
proxies_AdBlock: &proxies_AdBlock {type: select, proxies: [REJECT-DROP, REJECT, PASS, PASS-RULE, 直接连接, 漏网之鱼]}
proxies_QUIC: &proxies_QUIC       {type: select, proxies: [PASS-RULE, PASS, REJECT]}
proxies_direct: &proxies_direct   {type: select, proxies: [DIRECT, IPV4优先, IPV6优先, 仅IPV4, 仅IPV6]}
proxies_quanbu: &proxies_quanbu   {type: select, proxies: [自建CN2GIA-故转, 自建-故转, 香港-故转, 台湾-故转, 日本-故转, 新加坡-故转, 美国-故转, 韩国-故转, 英国-故转, 欧洲-故转, 德国-故转, 冷门-故转, 全球-故转, CF优选-故转, 家宽-故转, 高倍-故转, 低倍-故转, 直接连接]}

